databases:
  - name: smartrecruit-db
    databaseName: smartrecruit
    user: smartrecruit_user
    plan: free
    region: frankfurt

services:
  # 1. Backend Web Service (Node.js API)
  - type: web
    name: smartrecruit-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smartrecruit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAILS
        value: yhykk8899@gmail.com,saadtoufik67@gmail.com
      - key: STORAGE_PATH
        value: ./storage
      - key: PORT
        value: 10000

  # 2. Frontend Static Site (React Vite)
  - type: web
    name: smartrecruit-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://smartrecruit-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
