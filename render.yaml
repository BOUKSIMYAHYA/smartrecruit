databases:
  - name: smartrecruit-db
    databaseName: smartrecruit
    user: smartrecruit_user
    plan: free
    region: frankfurt

services:
  # 1. Backend Web Service (Node.js API)
  - type: web
    name: smartrecruit-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smartrecruit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAILS
        value: yhykk8899@gmail.com,saadtoufik67@gmail.com
      - key: STORAGE_PATH
        value: ./storage
      - key: PORT
        value: 10000
      - key: CLIENT_BASE_URL
        value: https://smartrecruit.space
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: yhykk8899@gmail.com
      - key: SMTP_PASS
        value: qaxkzgcvanbqirvv
      - key: SMTP_FROM
        value: SmartRecruit ATS - ESTC <yhykk8899@gmail.com>
      - key: SMTP_ENABLED
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: SmartRecruit ATS <onboarding@resend.dev>

  # 2. Frontend Static Site (React Vite)
  - type: web
    name: smartrecruit-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://smartrecruit-api-3i76.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
